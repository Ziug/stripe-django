<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>
    <script src="https://js.stripe.com/v3/"></script>
    <!-- всё же добавим немного стиля) -->
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #payment-form { max-width: 400px; margin: 0 auto; border: 1px solid #ccc; padding: 20px; border-radius: 5px; }
        #card-element { margin-bottom: 20px; padding: 10px; border: 1px solid #eee; }
        button { background: #5469d4; color: white; border: 0; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; }
        button:disabled { background: #ccc; }
        .hidden { display: none; }
        #error-message { color: red; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="payment-form">
        <h2>Checkout</h2>
        {% if item %}
            <p>Product: {{ item.name }}</p>
            <p>Total: {{ item.price }} {{ item.currency|upper }}</p>
        {% elif order %}
            <p>Order #{{ order.id }}</p>
            <p>Total: {{ total_amount }}</p>
        {% endif %}

        <div id="card-element"></div>
        
        <button id="submit">Pay Now</button>
        <div id="error-message"></div>
    </div>

    <script>
        const stripe = Stripe('{{ stripe_public_key }}');
        const clientSecret = '{{ client_secret }}';
        const elements = stripe.elements();
        
        const style = {
            base: {
                color: "#32325d",
                fontFamily: 'Arial, sans-serif',
                fontSmoothing: "antialiased",
                fontSize: "16px",
                "::placeholder": { color: "#32325d" }
            },
            invalid: {
                fontFamily: 'Arial, sans-serif',
                color: "#fa755a",
                iconColor: "#fa755a"
            }
        };

        const card = elements.create("card", { style: style });
        card.mount("#card-element");

        const submitButton = document.getElementById('submit');
        
        submitButton.addEventListener('click', async (e) => {
            e.preventDefault();
            submitButton.disabled = true; 
            submitButton.textContent = "Processing...";

            const { error, paymentIntent } = await stripe.confirmCardPayment(clientSecret, {
                payment_method: {
                    card: card,
                    billing_details: {
                        name: 'Test User'
                    }
                }
            });

            if (error) {
                document.getElementById('error-message').textContent = error.message;
                submitButton.disabled = false;
                submitButton.textContent = "Pay Now";
            } else {
                if (paymentIntent.status === 'succeeded') {
                    window.location.href = "{% url 'success' %}"; 
                }
            }
        });
    </script>
</body>
</html>
